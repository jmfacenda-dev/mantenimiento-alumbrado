
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento de alumbrado</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
}

header {
    background: #263746;
    color: white;
    padding: 15px;
    text-align: center;
}

nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background: white;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 6px;
    background: #263746;
    color: white;
    font-size: 15px;
}

button.active {
    background: #d69b24;
}

#plano {
    width: 100%;
    height: calc(100vh - 130px);
    overflow: auto;
    background: #ddd;
    touch-action: pan-x pan-y pinch-zoom;
}

#imagen {
    display: block;
    width: 100%;
    height: auto;
}
</style>
</head>

<body>

<header>
    <h2>Mantenimiento de alumbrado</h2>
</header>

<nav>
    <button onclick="mostrarPlano(1)" id="b1" class="active">Plano 1</button>
    <button onclick="mostrarPlano(2)" id="b2">Plano 2</button>
    <button onclick="mostrarPlano(3)" id="b3">Plano 3</button>
</nav>

<div id="plano">
    <img id="imagen" src="Planos Luces 1.png">
</div>

<script>
function mostrarPlano(numero) {

    const nombres = {
        1: "Planos Luces 1.png",
        2: "Planos Luces 2.png",
        3: "Planos Luces 3.png"
    };

    document.getElementById("imagen").src = nombres[numero];

    for (let i = 1; i <= 3; i++) {
        document.getElementById("b" + i)
            .classList.toggle("active", i === numero);
    }
}
</script>

</body>
</html>
